# PRIVACY: deploy _site/, never this folder. netlify/build-site.cjs fills it
# with the website files only: no netlify/ function source, no outreach/ or
# marketing/ (except the email pages + QR codes listed in the gitignored
# outreach/emails/PUBLIC-FILES.txt), no .env, package files or node_modules. Netlify serves files case-insensitively but matches the
# redirect rules below case-sensitively, so those rules alone did not hide
# deployed files (/Netlify/functions/... leaked, 2026-10-25). Functions are
# bundled from netlify/functions separately. Manual CLI deploy, from this folder
# (outreach/emails is gitignored, so not from a git-archive export):
#   node netlify/build-site.cjs
#   netlify deploy --prod --no-build --dir _site --functions netlify/functions --site 6cc5eece-1db2-4b39-9873-a2ebe9332f4e
# Never use --dir . here.
[build]
  command = "node netlify/build-site.cjs"
  publish = "_site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PRIVACY: outreach/ and marketing/ hold buyer contact lists, parcel-owner scans,
# personal letters and internal strategy notes. They were being published because
# the site deploys the whole folder. Keep the email QR/HTML assets reachable (sent
# emails may point at them) and 404 everything else. Added 2026-10-25.
[[redirects]]
  from = "/outreach/emails/*"
  to = "/outreach/emails/:splat"
  status = 200

[[redirects]]
  from = "/outreach/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/marketing/*"
  to = "/404.html"
  status = 404
  force = true

# SECURITY: the deploy folder holds netlify/functions/ (the lead function and
# its guard), which would otherwise be served as readable source at
# /netlify/functions/<name>.js. Functions run at /.netlify/functions/ (leading
# dot) and are unaffected. Same rule as the sibling sites. Do not remove.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
